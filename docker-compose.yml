version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mini_market_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: mini_market
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mini_market_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini_market_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Cho ORM đọc cấu hình DB
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: mini_market
      DB_USER: app_user
      DB_PASSWORD: app_pass
    ports:
      - "2025:2025"  # Port cho DTTP server
    networks:
      - mini_market_network
    stdin_open: true
    tty: true

volumes:
  mysql_data:

networks:
  mini_market_network:
    driver: bridge
