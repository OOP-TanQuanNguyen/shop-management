version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mini_market_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: mini_market
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_pass
    ports:
      - "1201:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - mini_market_network

    # CPU + Memory limits
    deploy:
      resources:
        limits:
          cpus: "1.0" # MySQL uses max 1 CPU
          memory: 3G # Must be > 2GB because buffer pool = 2GB
        reservations:
          memory: 2G

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini_market_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: mini_market
      DB_USER: app_user
      DB_PASSWORD: app_pass
    ports:
      - "2025:2025"
    networks:
      - mini_market_network
    stdin_open: true
    tty: true

    # CPU + Memory limit for backend
    deploy:
      resources:
        limits:
          cpus: "2.0" # max 2 CPUs
          memory: 1G
        reservations:
          memory: 512M

volumes:
  mysql_data:

networks:
  mini_market_network:
    driver: bridge
